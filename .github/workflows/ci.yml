name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - lua-auto-proposal-generation
          - lua-customer-support
          - lua-discord-moderator/agent
          - lua-discord-moderator/bot
          - lua-employee-onboarding
          - lua-financial-services
          - lua-hotel-agent
          - lua-linear-oauth
          - lua-real-estate
          - lua-shopping-assistant
          - lua-whatsapp-flow-otp
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci
      - run: npm run build
